services:
  pgdatabase:
    image: postgres:18
    environment:
      - .env
    volumes:
      - "ny_taxi_postgres_data:/var/lib/postgresql"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - .env
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    ports:
      - "8085:80"

  ingest_2019_01:
    build: .
    env_file:
      - .env
    environment:
      DB_YEAR: "2019"
      DB_MONTH: "01"
    depends_on:
      pgdatabase:
        condition: service_healthy


  ingest_2019_02:
    build: .
    env_file:
      - .env
    depends_on:
      pgdatabase:
        condition: service_healthy
    environment:
      DB_YEAR: "2019"
      DB_MONTH: "02"




volumes:
  ny_taxi_postgres_data:
  pgadmin_data: