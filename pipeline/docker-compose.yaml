services:
  pgdatabase:
    image: postgres:18
    environment:
      - .env
    volumes:
      - "ny_taxi_postgres_data:/var/lib/postgresql"
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - .env
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    ports:
      - "8085:80"

#  ingest:
#    build: .
#    environment:
#      - .env



volumes:
  ny_taxi_postgres_data:
  pgadmin_data: